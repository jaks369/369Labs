services:
  - type: web
    name: 369labs
    runtime: node
    # No db:push here: the app self-migrates on boot (ensure*Table chain) and
    # a failing migration step used to abort deploys, leaving the previous
    # container running against whatever old DATABASE_URL it had.
    buildCommand: pnpm install --no-frozen-lockfile && pnpm check && pnpm build
    startCommand: NODE_ENV=production node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VITE_DERIV_APP_ID
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: OPENAI_API_BASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NODE_ENV
        value: production